<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knights of the Sea</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06182a; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <script src="public/lib/phaser.min.js"></script>
  <script src="public/lib/peerjs.min.js"></script>

  <!-- Domain (shared with the Node server) -->
  <script src="shared/rules.js"></script>
  <script src="shared/room-code.js"></script>
  <script src="shared/board.js"></script>
  <script src="shared/match.js"></script>

  <!-- Session clients: hot seat, peer-to-peer online (default), server online (?net=server) -->
  <script src="src/net/local-session.js"></script>
  <script src="src/net/peer-session.js"></script>
  <script src="src/net/remote-session.js"></script>

  <!-- Presentation -->
  <script src="src/audio/sfx.js"></script>
  <script src="src/ui/theme.js"></script>
  <script src="src/ui/widgets.js"></script>
  <script src="src/ui/board-view.js"></script>
  <script src="src/scenes/game-scene.js"></script>
  <script src="src/scenes/boot-scene.js"></script>
  <script src="src/scenes/menu-scene.js"></script>
  <script src="src/scenes/lobby-scene.js"></script>
  <script src="src/scenes/placement-scene.js"></script>
  <script src="src/scenes/combat-scene.js"></script>

  <script src="src/main.js"></script>
</body>

</html>
